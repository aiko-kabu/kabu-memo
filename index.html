<style>
:root{
  --ink:#12160f; --paper:#f6f4ec; --card:#fffdf7; --line:#ddd8c8;
  --muted:#8a8674; --seal:#c0392b; --grow:#1f6f54; --accent:#b8892b;
  --shadow: 0 1px 0 #fff inset, 0 1px 3px rgba(30,25,10,.08);
  --sans:-apple-system,system-ui,"Hiragino Kaku Gothic ProN",sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;
  background:radial-gradient(circle at 12% -5%, #fbf9f1, transparent 40%), var(--paper);
  color:var(--ink); font-family:var(--serif);
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button{font-family:var(--sans)}

.masthead{
  display:flex; justify-content:space-between; align-items:center;
  padding:calc(16px + env(safe-area-inset-top)) 20px 16px;
  border-bottom:2px solid var(--ink); gap:12px; flex-wrap:wrap;
}
.mast-left{display:flex; align-items:center; gap:14px}
.mast-mark{
  width:44px; height:44px; flex:0 0 44px; background:var(--seal); color:#fff;
  display:grid; place-items:center; font-size:24px; font-weight:700;
  border-radius:6px; box-shadow:0 2px 0 rgba(120,20,10,.4); font-family:var(--serif);
}
.masthead h1{margin:0; font-size:26px; letter-spacing:.08em; font-weight:700}
.mast-sub{margin:2px 0 0; font-size:12.5px; color:var(--muted); font-family:var(--sans)}
.mast-status{font-size:13px; color:var(--muted); font-family:var(--sans); font-variant-numeric:tabular-nums}

.toolbar{
  display:flex; gap:8px; padding:12px 16px 0; flex-wrap:wrap; align-items:center;
}
.tool-btn{
  appearance:none; cursor:pointer; border:1px solid var(--line); background:#fff;
  color:var(--muted); padding:7px 13px; border-radius:7px; font-size:13px; font-weight:600;
}
.tool-btn:hover{color:var(--ink)}
.tool-spacer{flex:1}

.tabs{display:flex; padding:0 16px; margin-top:12px; border-bottom:1px solid var(--line)}
.tab{
  appearance:none; border:none; background:none; cursor:pointer; padding:12px 18px;
  font-size:15px; color:var(--muted); font-weight:600; border-bottom:2.5px solid transparent;
  margin-bottom:-1px; letter-spacing:.03em;
}
.tab.on{color:var(--ink); border-color:var(--ink)}
.tab.on.buy{color:var(--grow); border-color:var(--grow)}
.tab.on.sell{color:var(--seal); border-color:var(--seal)}

.banner{margin:12px 16px 0; padding:10px 14px; font-size:13.5px; font-family:var(--sans); border-radius:6px}
.banner.err{background:#fdecea; border-left:3px solid var(--seal); color:#8a241a}
.banner.ok{background:#eaf4ef; border-left:3px solid var(--grow); color:#1a5c44}

.content{padding:18px 16px}
.empty{text-align:center; padding:64px 20px; color:var(--muted); font-family:var(--sans)}
.empty p{margin:0 0 16px; font-size:15px}
.cta{appearance:none; border:none; cursor:pointer; background:var(--ink); color:#fff; padding:12px 22px; border-radius:8px; font-size:15px; font-weight:600}

.ticker{display:flex; flex-direction:column; gap:2px; min-width:0}
.code{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.12em; font-family:var(--sans)}
.name{font-size:19px; font-weight:700; letter-spacing:.03em}

/* row list (一覧・候補で共通) */
.rows{display:flex; flex-direction:column; gap:8px; max-width:640px; margin:0 auto}
.row{
  appearance:none; cursor:pointer; text-align:left; width:100%;
  display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:12px;
  padding:14px 14px; background:var(--card); border:1px solid var(--line); border-radius:8px;
}
.row:hover{border-color:var(--accent)}
.row-no{font-size:17px; font-weight:700; color:var(--accent); text-align:center; font-variant-numeric:tabular-nums; font-family:var(--sans)}
.row-no.dot{color:var(--line)}
.row-tick{display:flex; flex-direction:column; min-width:0; gap:1px}
.row-code{font-size:11px; color:var(--accent); font-weight:700; letter-spacing:.1em; font-family:var(--sans)}
.row-name{font-size:16px; font-weight:700; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-div{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--sans); min-width:72px; text-align:right; color:var(--muted)}
.row-div.under{color:var(--grow)}
.row-div.over{color:var(--seal)}

.summary{margin:0; font-size:13.5px; color:#4a4636; line-height:1.5; font-family:var(--sans)}
.memo{margin:0; font-size:13px; color:#5b5646; line-height:1.65; white-space:pre-wrap; padding:10px 12px; background:#faf8f0; border-left:2px solid var(--line); border-radius:0 6px 6px 0; font-family:var(--sans)}
.stats{display:flex; flex-wrap:wrap; gap:8px}
.stat{flex:1 1 30%; min-width:80px; background:#faf8ef; border:1px solid var(--line); border-radius:7px; padding:8px 10px; display:flex; flex-direction:column; gap:2px}
.stat.wide{flex-basis:100%}
.stat-label{font-size:11px; color:var(--muted); font-family:var(--sans)}
.stat-value{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--sans)}
.price-row{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:8px; margin-top:2px; background:#f2efe4; border:1px solid var(--line)}
.price-row.under{background:#eaf4ef; border-color:#c4e0d3}
.price-row.over{background:#fbecea; border-color:#eecdc7}
.pr-label{display:block; font-size:11px; color:var(--muted); font-family:var(--sans)}
.pr-price{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--sans)}
.pr-div{text-align:right}
.pr-val{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--sans)}
.price-row.under .pr-val{color:var(--grow)}
.price-row.over .pr-val{color:var(--seal)}

.rank-note{font-size:12.5px; color:var(--muted); margin:0 0 4px; font-family:var(--sans)}

.fab{position:fixed; right:22px; bottom:calc(24px + env(safe-area-inset-bottom)); width:58px; height:58px; border-radius:50%; border:none; cursor:pointer; background:var(--ink); color:#fff; font-size:30px; line-height:1; box-shadow:0 4px 14px rgba(20,15,5,.3)}

.sheet-backdrop{position:fixed; inset:0; background:rgba(30,25,15,.4); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.sheet{background:var(--paper); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; border-top:3px solid var(--ink)}
.sheet-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:2}
.sheet-head h2{margin:0; font-size:19px; letter-spacing:.05em}
.x{appearance:none; border:none; background:none; font-size:26px; cursor:pointer; color:var(--muted); line-height:1}
.sheet-body{padding:18px 20px; display:flex; flex-direction:column; gap:14px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.field{display:flex; flex-direction:column; gap:6px}
.field-label{font-size:12.5px; color:var(--muted); font-weight:600; font-family:var(--sans)}
.field input,.field textarea{font-family:var(--sans); font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); width:100%}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.field textarea{resize:vertical; line-height:1.6}
.hint{font-size:11.5px; color:var(--muted); font-family:var(--sans)}
.preview{background:#faf8ef; border:1px dashed var(--accent); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.preview-line{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.preview-label{font-size:12px; color:var(--muted); font-family:var(--sans)}
.preview-value{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--sans)}
.preview-value.under{color:var(--grow)}
.preview-value.over{color:var(--seal)}
.sheet-foot{display:flex; gap:10px; padding:14px 20px calc(22px + env(safe-area-inset-bottom)); position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line)}
.ghost{flex:1; appearance:none; cursor:pointer; background:#fff; border:1px solid var(--line); color:var(--muted); padding:12px; border-radius:9px; font-size:15px; font-weight:600}
.ghost.del{color:var(--seal); border-color:#e8c9c4}
.primary{flex:2; appearance:none; cursor:pointer; background:var(--ink); color:#fff; border:none; padding:12px; border-radius:9px; font-size:15px; font-weight:700}
.primary.wide{flex:1 1 100%}
.danger-zone{margin-top:22px; padding-top:14px; border-top:1px dashed var(--line); display:flex; justify-content:center}
.del-link{appearance:none; background:none; border:none; cursor:pointer; color:var(--muted); font-size:12.5px; font-family:var(--sans); text-decoration:underline; text-underline-offset:2px; padding:6px 10px}
.del-link:hover{color:var(--seal)}

@media (max-width:420px){ .masthead h1{font-size:22px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* toolbar accent (AI paste) */
.tool-btn.accent{background:var(--seal); color:#fff; border-color:var(--seal)}
.tool-btn.accent:hover{color:#fff; opacity:.92}

/* score badge on rows */
.row-score{display:inline-block; margin-left:8px; background:var(--ink); color:#fff; font-family:var(--sans); font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px; vertical-align:middle; font-variant-numeric:tabular-nums}

/* paste modal */
.paste-help{font-size:13px; color:#5b5646; line-height:1.6; font-family:var(--sans); margin:0 0 12px}
.paste-help b{color:var(--ink)}

/* analysis block in detail */
.analysis{display:flex; flex-direction:column; gap:14px; margin-top:4px}
.score-row{display:flex; justify-content:space-between; align-items:center; background:var(--ink); color:#fff; padding:12px 16px; border-radius:8px}
.score-label{font-size:13px; font-family:var(--sans); letter-spacing:.04em}
.score-val{font-size:24px; font-weight:800; font-family:var(--sans); font-variant-numeric:tabular-nums}
.score-val small{font-size:13px; font-weight:600; opacity:.7}
.eval-list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.eval-item{display:grid; grid-template-columns:104px 1fr; gap:10px; background:var(--card); padding:9px 12px}
.eval-k{font-size:12px; color:var(--muted); font-family:var(--sans); font-weight:600}
.eval-v{font-size:13.5px; color:#3f3b2d; font-family:var(--sans); line-height:1.5}
.cats{display:flex; flex-direction:column; gap:10px}
.cat{border-radius:8px; padding:10px 14px}
.cat.bull{background:#eaf4ef; border:1px solid #c4e0d3}
.cat.bear{background:#fbecea; border:1px solid #eecdc7}
.cat-title{font-size:12px; font-weight:700; font-family:var(--sans); letter-spacing:.04em}
.cat.bull .cat-title{color:var(--grow)}
.cat.bear .cat-title{color:var(--seal)}
.cat ul{margin:6px 0 0; padding-left:18px}
.cat li{font-size:13.5px; color:#3f3b2d; font-family:var(--sans); line-height:1.55; margin:2px 0}
.basis{background:#faf8ef; border-left:3px solid var(--accent); border-radius:0 6px 6px 0; padding:9px 12px; display:flex; flex-direction:column; gap:3px}
.basis-k{font-size:11.5px; color:var(--accent); font-weight:700; font-family:var(--sans)}
.basis-v{font-size:13.5px; color:#3f3b2d; font-family:var(--sans); line-height:1.55}
.watch{background:#f2efe4; border:1px solid var(--line); border-radius:8px; padding:10px 14px; display:flex; flex-direction:column; gap:3px}
.watch-k{font-size:11.5px; color:var(--muted); font-weight:700; font-family:var(--sans)}
.watch-v{font-size:13.5px; color:#3f3b2d; font-family:var(--sans); line-height:1.55}

/* extended fields section in editor */
.ext{border:1px solid var(--line); border-radius:8px; padding:0 14px; background:#fbf9f1}
.ext summary{cursor:pointer; padding:12px 0; font-size:13.5px; font-weight:700; color:var(--ink); font-family:var(--sans); list-style-position:inside}
.ext[open] summary{border-bottom:1px solid var(--line); margin-bottom:12px}
.ext .field{margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>

<!-- hidden file input for JSON import -->
<input type="file" id="importInput" accept="application/json,.json" style="display:none">

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "kabu:cards:v1";

  // AIに投げる分析プロンプト（コピーボタンで使う）
  var ANALYSIS_PROMPT =
'あなたは日本株の決算分析アシスタントです。これから渡す決算短信・IR資料・決算説明資料を読み、'+
'必要に応じて会社HP・過去決算・株探・IFIS/コンセンサス等の公開情報も踏まえて分析し、'+
'結果を下記のJSON形式「のみ」で出力してください。前後の説明文やコードフェンスは不要です。\n\n'+
'制約:\n'+
'- 数値項目（epsLow, epsHigh, perLow, perHigh, price, score）は数値のみ。\n'+
'- 理論株価は計算しないでください（アプリがEPS×PERで自動計算します）。\n'+
'- epsLow/epsHighは想定EPSのレンジ、perLow/perHighは妥当と考えるPERのレンジ。\n'+
'- bull/bear は配列で、それぞれ根拠を1つずつ簡潔に。\n'+
'- 各根拠（epsBasis, perBasis）は「なぜその数字か」が半年後に分かるように具体的に。\n'+
'- 不明な項目は空文字 "" にしてください。憶測で埋めないこと。\n\n'+
'{\n'+
'  "code": "証券コード",\n'+
'  "name": "会社名",\n'+
'  "summary": "どんな会社か・主力事業・注目テーマを1〜2文で",\n'+
'  "memo": "決算の要点を自由文で（売上・利益・利益率・受注などの数字を含めて）",\n'+
'  "score": 8,\n'+
'  "revGrowth": "売上成長の評価",\n'+
'  "profGrowth": "利益成長の評価",\n'+
'  "marginChange": "利益率の変化",\n'+
'  "surprise": "会社予想やコンセンサスに対する上振れ/下振れ",\n'+
'  "oneTime": "一時要因の有無と内容",\n'+
'  "orders": "受注・受注残・契約負債など先行指標",\n'+
'  "continuity": "この好調/不調は継続的か",\n'+
'  "nextGuidance": "次期の会社予想",\n'+
'  "consensus": "市場コンセンサスとの比較",\n'+
'  "bull": ["強気材料1", "強気材料2"],\n'+
'  "bear": ["弱気材料1", "弱気材料2"],\n'+
'  "epsLow": 100,\n'+
'  "epsHigh": 130,\n'+
'  "epsBasis": "想定EPSレンジの根拠",\n'+
'  "perLow": 25,\n'+
'  "perHigh": 35,\n'+
'  "perBasis": "妥当PERレンジの根拠",\n'+
'  "price": 現在株価,\n'+
'  "watch": "次の決算で見るべきポイント"\n'+
'}';


  // ---------- state ----------
  var state = {
    cards: load(),
    tab: "list",        // list | buy | sell
    viewing: null,      // card id being shown in the detail sheet, or null
    editing: null,      // card object being edited, or null
    pasting: false,     // AI分析JSONの貼り付けモーダル表示中か
    banner: null        // {type:'ok'|'err', text}
  };

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cards));
    }catch(e){
      flash("err","保存に失敗しました。端末の空き容量をご確認ください。");
    }
  }
  function flash(type,text){
    state.banner = {type:type, text:text};
    render();
    setTimeout(function(){ state.banner=null; render(); }, 2600);
  }

  function uid(){
    return (crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2);
  }

  // ---------- calc ----------
  function num(v){ var n=parseFloat(v); return isFinite(n)?n:NaN; }

  // 想定株価レンジ = EPSレンジ × PERレンジ。無ければ旧rangeにフォールバック。
  function targetRange(c){
    var el=num(c.epsLow), eh=num(c.epsHigh), pl=num(c.perLow), ph=num(c.perHigh);
    var hasEps = isFinite(el) && el>0, hasPer = isFinite(pl) && pl>0;
    if(hasEps && hasPer){
      var ehh = (isFinite(eh)&&eh>0)?eh:el;
      var phh = (isFinite(ph)&&ph>0)?ph:pl;
      var lo=el*pl, hi=ehh*phh;
      return {low:Math.min(lo,hi), high:Math.max(lo,hi)};
    }
    var rl=num(c.rangeLow), rh=num(c.rangeHigh);
    if(isFinite(rl) && rl>0){ return {low:rl, high:(isFinite(rh)&&rh>0)?rh:rl}; }
    return null;
  }
  // 乖離率 = (現在株価 - 想定下限) / 想定下限
  function divergence(c){
    var r=targetRange(c), p=num(c.price);
    if(!r || !isFinite(p) || p<=0) return null;
    return (p - r.low)/r.low;
  }
  function pct(n){
    if(n===null) return "—";
    return (n>0?"+":"") + (n*100).toFixed(1) + "%";
  }
  function yen(v){
    var n=num(v);
    if(!isFinite(n)) return "—";
    return "¥" + Math.round(n).toLocaleString("ja-JP");
  }
  function rangeText(lo,hi){
    var a=num(lo), b=num(hi);
    if(!isFinite(a)) return "—";
    if(!isFinite(b) || b===a) return ""+a;
    return a+"〜"+b;
  }
  function esc(s){
    return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  // ---------- rankings ----------
  function ranked(dir){
    var rows = state.cards.map(function(c){ return {c:c, d:divergence(c)}; })
      .filter(function(x){ return x.d!==null; });
    rows.sort(function(a,b){ return dir==="buy" ? a.d-b.d : b.d-a.d; });
    return rows;
  }

  // ---------- render ----------
  var app = document.getElementById("app");

  function render(){
    var html = "";
    html += masthead();
    html += toolbar();
    html += tabs();
    if(state.banner){
      html += '<div class="banner '+state.banner.type+'">'+esc(state.banner.text)+'</div>';
    }
    html += '<main class="content">';
    if(state.tab==="list") html += listView();
    else html += rankView(state.tab);
    html += '</main>';
    if(state.tab==="list" && state.cards.length>0){
      html += '<button class="fab" data-act="new" aria-label="銘柄を追加">＋</button>';
    }
    if(state.editing) html += editor(state.editing);
    else if(state.viewing) {
      var vc = cardById(state.viewing);
      if(vc) html += detail(vc);
    }
    if(state.pasting) html += pasteModal();
    app.innerHTML = html;
    bind();
  }

  function masthead(){
    var status = state.cards.length + " 銘柄";
    return ''+
      '<header class="masthead">'+
        '<div class="mast-left">'+
          '<div class="mast-mark">株</div>'+
          '<div><h1>株メモ</h1><p class="mast-sub">決算メモと想定株価レンジで、買い時・売り時を並べる</p></div>'+
        '</div>'+
        '<div class="mast-status">'+status+'</div>'+
      '</header>';
  }

  function toolbar(){
    return ''+
      '<div class="toolbar">'+
        '<button class="tool-btn accent" data-act="paste">＋ AI分析を貼り付け</button>'+
        '<button class="tool-btn" data-act="export">JSON書き出し</button>'+
        '<button class="tool-btn" data-act="import">JSON読み込み</button>'+
        '<span class="tool-spacer"></span>'+
      '</div>';
  }

  function tabs(){
    function t(key,label,cls){
      var on = state.tab===key ? (" on"+(cls?(" "+cls):"")) : "";
      return '<button class="tab'+on+'" data-tab="'+key+'">'+label+'</button>';
    }
    return '<nav class="tabs">'+t("list","一覧","")+t("buy","買い候補","buy")+t("sell","売り候補","sell")+'</nav>';
  }

  function cardById(id){
    return state.cards.filter(function(c){return c.id===id;})[0] || null;
  }

  // 一列の行（一覧・候補で共通）。rank を渡すと左に順位を出す。
  function row(c, rank){
    var d=divergence(c);
    var tone = d===null ? "" : (d<0?"under":"over");
    var no = rank ? '<span class="row-no">'+rank+'</span>' : '<span class="row-no dot">・</span>';
    var badge = String(c.score||"").trim()!=="" ? '<span class="row-score">'+esc(c.score)+'</span>' : '';
    return '<button class="row" data-view="'+c.id+'">'+
      no+
      '<span class="row-tick">'+
        '<span class="row-code">'+esc(c.code||"—")+'</span>'+
        '<span class="row-name">'+esc(c.name||"（無名）")+badge+'</span>'+
      '</span>'+
      '<span class="row-div '+tone+'">'+pct(d)+'</span>'+
    '</button>';
  }

  function listView(){
    if(state.cards.length===0){
      return '<div class="empty"><p>まだ銘柄がありません。</p>'+
             '<button class="cta" data-act="new">最初の銘柄を追加</button></div>';
    }
    var out = '<div class="rows">';
    out += state.cards.map(function(c){ return row(c, null); }).join("");
    out += '</div>';
    return out;
  }

  function rankView(mode){
    var rows = ranked(mode);
    if(rows.length===0){
      return '<div class="empty"><p>ランキングを出すには、想定EPS・PERと現在株価が要ります。</p></div>';
    }
    var note = mode==="buy" ? "想定レンジ下限より安い順。上ほど割安。"
                            : "想定レンジ下限より高い順。上ほど割高。";
    var out = '<div class="rows"><p class="rank-note">'+note+'</p>';
    rows.forEach(function(x,i){ out += row(x.c, i+1); });
    return out+'</div>';
  }

  function stat(label,value,wide){
    return '<div class="stat'+(wide?" wide":"")+'">'+
      '<span class="stat-label">'+esc(label)+'</span>'+
      '<span class="stat-value">'+esc(value)+'</span></div>';
  }

  // ---------- paste AI analysis (JSON) ----------
  function pasteModal(){
    return ''+
    '<div class="sheet-backdrop" data-act="close-paste-bg">'+
      '<div class="sheet" data-stop="1">'+
        '<div class="sheet-head"><h2>AI分析を貼り付け</h2><button class="x" data-act="close-paste">×</button></div>'+
        '<div class="sheet-body">'+
          '<p class="paste-help">ChatGPT等でIRを分析させ、返ってきた<b>JSON</b>をそのまま貼り付けてください。1銘柄でも、複数銘柄の配列でも取り込めます。</p>'+
          '<button class="tool-btn" data-act="copy-prompt">分析プロンプトをコピー</button>'+
          '<label class="field" style="margin-top:14px"><span class="field-label">JSON</span>'+
            '<textarea id="pasteBox" rows="12" placeholder=\'{ "code": "6327", "name": "北川精機", ... }\'></textarea></label>'+
        '</div>'+
        '<div class="sheet-foot">'+
          '<button class="ghost" data-act="close-paste">やめる</button>'+
          '<button class="primary" data-act="apply-paste">取り込む</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  // 貼り付けJSONを1件パースして編集フォームに流し込む（複数件は一括取り込み）
  function applyPaste(){
    var box = document.getElementById("pasteBox");
    var text = box ? box.value.trim() : "";
    if(!text){ flash("err","JSONを貼り付けてください。"); return; }
    // ```json ... ``` のフェンスが付いていても拾えるように除去
    text = text.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
    var data;
    try{ data = JSON.parse(text); }
    catch(e){ flash("err","JSONの形式が正しくありません。"); return; }

    var list = Array.isArray(data) ? data : (data && Array.isArray(data.cards) ? data.cards : [data]);
    if(list.length===1){
      // 1件なら編集フォームを開いて確認・保存の流れに
      var one = normalize(list[0]);
      one.id = uid();
      // 既存の同コード銘柄があれば、そのidを引き継いで上書き扱いに
      var key = keyOf(one);
      var existing = state.cards.filter(function(c){ return keyOf(c)===key; })[0];
      if(existing) one.id = existing.id;
      state.pasting=false;
      state.editing=one;
      render();
    }else{
      // 複数件は時刻マージで一括取り込み（importと同じ挙動）
      var byKey={}; state.cards.forEach(function(c){ byKey[keyOf(c)]=c; });
      var added=0, updated=0;
      list.forEach(function(raw){
        var inc=normalize(raw); inc.updatedAt = inc.updatedAt || new Date().toISOString();
        var key=keyOf(inc), cur=byKey[key];
        if(!cur){ inc.id=uid(); byKey[key]=inc; added++; }
        else { inc.id=cur.id; byKey[key]=inc; updated++; }
      });
      state.cards = Object.keys(byKey).map(function(k){ return byKey[k]; });
      save();
      state.pasting=false;
      flash("ok","取り込み完了（追加 "+added+" / 更新 "+updated+"）");
      render();
    }
  }

  function copyPrompt(){
    var p = ANALYSIS_PROMPT;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(p).then(
        function(){ flash("ok","分析プロンプトをコピーしました。"); },
        function(){ fallbackCopy(p); }
      );
    }else{ fallbackCopy(p); }
  }
  function fallbackCopy(text){
    var ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); flash("ok","分析プロンプトをコピーしました。"); }
    catch(e){ flash("err","コピーできませんでした。手動で選択してください。"); }
    document.body.removeChild(ta);
  }

  // 拡張分析項目の表示ブロック（値があるものだけ出す）
  function analysisBlock(c){
    var out = "";
    // 決算スコア
    if(String(c.score||"").trim()!==""){
      out += '<div class="score-row"><span class="score-label">決算評価</span>'+
             '<span class="score-val">'+esc(c.score)+' <small>/ 10</small></span></div>';
    }
    // 評価コメント群（ある項目だけ行にする）
    var rows = [
      ["売上成長", c.revGrowth], ["利益成長", c.profGrowth], ["利益率変化", c.marginChange],
      ["上振れ/下振れ", c.surprise], ["一時要因", c.oneTime], ["受注・受注残", c.orders],
      ["継続性", c.continuity], ["次期会社予想", c.nextGuidance], ["コンセンサス", c.consensus]
    ].filter(function(r){ return String(r[1]||"").trim()!==""; });
    if(rows.length){
      out += '<div class="eval-list">';
      rows.forEach(function(r){
        out += '<div class="eval-item"><span class="eval-k">'+esc(r[0])+'</span>'+
               '<span class="eval-v">'+esc(r[1])+'</span></div>';
      });
      out += '</div>';
    }
    // 強気/弱気材料
    function bullets(title,text,cls){
      var items = String(text||"").split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
      if(!items.length) return "";
      var lis = items.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join("");
      return '<div class="cat '+cls+'"><span class="cat-title">'+title+'</span><ul>'+lis+'</ul></div>';
    }
    var bb = bullets("強気材料", c.bull, "bull") + bullets("弱気材料", c.bear, "bear");
    if(bb) out += '<div class="cats">'+bb+'</div>';
    // 根拠
    var basis = "";
    if(String(c.epsBasis||"").trim()!=="") basis += '<div class="basis"><span class="basis-k">想定EPSの根拠</span><span class="basis-v">'+esc(c.epsBasis)+'</span></div>';
    if(String(c.perBasis||"").trim()!=="") basis += '<div class="basis"><span class="basis-k">妥当PERの根拠</span><span class="basis-v">'+esc(c.perBasis)+'</span></div>';
    if(basis) out += basis;
    // 次に見るポイント
    if(String(c.watch||"").trim()!==""){
      out += '<div class="watch"><span class="watch-k">次に見るポイント</span><span class="watch-v">'+esc(c.watch)+'</span></div>';
    }
    if(out) out = '<div class="analysis">'+out+'</div>';
    return out;
  }

  // ---------- detail sheet ----------
  function detail(c){
    var d=divergence(c), r=targetRange(c);
    var tone = d===null ? "" : (d<0?"under":"over");
    var body = "";
    if(c.summary) body += '<p class="summary">'+esc(c.summary)+'</p>';
    if(c.memo) body += '<p class="memo">'+esc(c.memo)+'</p>';
    body += '<div class="stats">'+
      stat("想定EPS", rangeText(c.epsLow,c.epsHigh), false)+
      stat("想定PER", rangeText(c.perLow,c.perHigh), false)+
      stat("想定株価（EPS×PER）", r?(yen(r.low)+"〜"+yen(r.high)):"—", true)+
    '</div>';
    body += '<div class="price-row '+tone+'">'+
      '<div><span class="pr-label">現在株価</span><span class="pr-price">'+yen(c.price)+'</span></div>'+
      '<div class="pr-div"><span class="pr-label">下限乖離</span><span class="pr-val">'+pct(d)+'</span></div>'+
    '</div>';
    body += analysisBlock(c);
    return ''+
    '<div class="sheet-backdrop" data-act="close-view-bg">'+
      '<div class="sheet" data-stop="1">'+
        '<div class="sheet-head">'+
          '<div class="ticker"><span class="code">'+esc(c.code||"—")+'</span>'+
          '<span class="name">'+esc(c.name||"（無名）")+'</span></div>'+
          '<button class="x" data-act="close-view">×</button>'+
        '</div>'+
        '<div class="sheet-body">'+body+
          '<div class="danger-zone"><button class="del-link" data-act="del-view">この銘柄を削除</button></div>'+
        '</div>'+
        '<div class="sheet-foot">'+
          '<button class="primary wide" data-act="edit-view">編集</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function editor(v){
    var r=targetRange(v), d=divergence(v);
    var previewRange = r ? (yen(r.low)+"〜"+yen(r.high)) : "EPS・PERを入れると自動計算";
    var previewDiv = d!==null ?
      '<div class="preview-line"><span class="preview-label">下限乖離</span>'+
      '<span class="preview-value '+(d<0?"under":"over")+'">'+pct(d)+'</span></div>' : "";
    function f(label,key,ph,mode){
      return '<label class="field"><span class="field-label">'+label+'</span>'+
        '<input data-field="'+key+'" value="'+esc(v[key])+'" placeholder="'+ph+'"'+
        (mode?(' inputmode="'+mode+'"'):'')+'></label>';
    }
    function ta(label,key,ph,rows){
      return '<label class="field"><span class="field-label">'+label+'</span>'+
        '<textarea data-field="'+key+'" rows="'+(rows||2)+'" placeholder="'+ph+'">'+esc(v[key])+'</textarea></label>';
    }
    return ''+
    '<div class="sheet-backdrop" data-act="close-bg">'+
      '<div class="sheet" data-stop="1">'+
        '<div class="sheet-head"><h2>銘柄メモ</h2><button class="x" data-act="close">×</button></div>'+
        '<div class="sheet-body">'+
          '<div class="row2">'+f("コード","code","6367","numeric")+f("銘柄名","name","ダイキン","")+'</div>'+
          '<label class="field"><span class="field-label">どんな会社か</span>'+
            '<input data-field="summary" value="'+esc(v.summary)+'" placeholder="空調の世界大手。業務用に強い。"></label>'+
          '<label class="field"><span class="field-label">決算メモ</span>'+
            '<textarea data-field="memo" rows="4" placeholder="1Q eps◯◯、○○が好調。割引要素は…">'+esc(v.memo)+'</textarea></label>'+
          '<div class="row2">'+f("想定EPS 下限","epsLow","135","decimal")+f("想定EPS 上限","epsHigh","135","decimal")+'</div>'+
          '<div class="row2">'+f("想定PER 下限","perLow","15","decimal")+f("想定PER 上限","perHigh","18","decimal")+'</div>'+
          '<div class="preview">'+
            '<div class="preview-line"><span class="preview-label">想定株価レンジ</span>'+
            '<span class="preview-value">'+previewRange+'</span></div>'+ previewDiv +
          '</div>'+
          '<label class="field"><span class="field-label">現在株価</span>'+
            '<input data-field="price" value="'+esc(v.price)+'" placeholder="2050" inputmode="decimal">'+
            '<span class="hint">想定株価レンジは EPS×PER で自動計算。乖離とランキングは「下限」と「現在株価」で出します。</span></label>'+
          '<details class="ext"'+(hasExt(v)?' open':'')+'>'+
            '<summary>AI分析の詳細項目</summary>'+
            f("決算評価（10点満点）","score","8","decimal")+
            '<div class="row2">'+ta("売上成長","revGrowth","+6.1%")+ta("利益成長","profGrowth","+52.2%")+'</div>'+
            '<div class="row2">'+ta("利益率変化","marginChange","14.4%→12.0%予想")+ta("上振れ/下振れ","surprise","上振れ余地")+'</div>'+
            '<div class="row2">'+ta("一時要因","oneTime","なし")+ta("受注・受注残","orders","契約負債が急増")+'</div>'+
            '<div class="row2">'+ta("継続性","continuity","AIサーバー需要で継続的")+ta("次期会社予想","nextGuidance","売上+51.3%")+'</div>'+
            ta("コンセンサス","consensus","会社予想を上回る想定")+
            ta("強気材料（1行に1つ）","bull","高多層基板の需要増\\n粗利率の改善","4")+
            ta("弱気材料（1行に1つ）","bear","会社予想が保守的すぎる可能性","4")+
            ta("想定EPSの根拠","epsBasis","会社予想99円＋営業利益率上振れケース")+
            ta("妥当PERの根拠","perBasis","産業機械の通常レンジ＋AI成長プレミアム")+
            ta("次に見るポイント","watch","2Qで利益率が予想を上回るか")+
          '</details>'+
        '</div>'+
        '<div class="sheet-foot">'+
          '<button class="ghost" data-act="close">やめる</button>'+
          '<button class="primary" data-act="save">保存</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  // ---------- events ----------
  function blank(){
    return {
      id:uid(), code:"",name:"",summary:"",memo:"",
      epsLow:"",epsHigh:"",perLow:"",perHigh:"",price:"",
      rangeLow:"",rangeHigh:"",updatedAt:"",
      // --- 拡張（AI分析）項目 ---
      score:"",              // 決算評価 10点満点
      revGrowth:"",          // 売上成長
      profGrowth:"",         // 利益成長
      marginChange:"",       // 利益率変化
      surprise:"",           // 上振れ/下振れ
      oneTime:"",            // 一時要因
      orders:"",             // 受注・受注残
      continuity:"",         // 継続性
      nextGuidance:"",       // 次期会社予想
      consensus:"",          // コンセンサス
      bull:"",               // 強気材料（改行区切り）
      bear:"",               // 弱気材料（改行区切り）
      epsBasis:"",           // 想定EPSの根拠
      perBasis:"",           // 妥当PERの根拠
      watch:""               // 次に見るポイント
    };
  }
  // 拡張項目のキー一覧（取り込み・正規化で共通利用）
  var EXT_KEYS = ["score","revGrowth","profGrowth","marginChange","surprise","oneTime",
    "orders","continuity","nextGuidance","consensus","bull","bear","epsBasis","perBasis","watch"];
  var CORE_KEYS = ["code","name","summary","memo","epsLow","epsHigh","perLow","perHigh",
    "price","rangeLow","rangeHigh","updatedAt"];
  // 拡張項目に何か入っているか（編集画面で詳細セクションを開くか判定）
  function hasExt(c){
    return EXT_KEYS.some(function(k){ return String(c[k]||"").trim()!==""; });
  }

  function bind(){
    // tabs
    app.querySelectorAll("[data-tab]").forEach(function(b){
      b.onclick=function(){ state.tab=b.getAttribute("data-tab"); render(); };
    });
    // top-level actions
    app.querySelectorAll("[data-act]").forEach(function(b){
      var act=b.getAttribute("data-act");
      b.onclick=function(e){
        if(act==="new"){ state.editing=blank(); render(); }
        else if(act==="close"){ state.editing=null; render(); }
        else if(act==="close-bg"){ if(e.target===b){ state.editing=null; render(); } }
        else if(act==="save"){ saveEditing(); }
        else if(act==="export"){ doExport(); }
        else if(act==="import"){ document.getElementById("importInput").click(); }
        else if(act==="paste"){ state.pasting=true; render(); }
        else if(act==="close-paste"){ state.pasting=false; render(); }
        else if(act==="close-paste-bg"){ if(e.target===b){ state.pasting=false; render(); } }
        else if(act==="apply-paste"){ applyPaste(); }
        else if(act==="copy-prompt"){ copyPrompt(); }
        // detail sheet
        else if(act==="close-view"){ state.viewing=null; render(); }
        else if(act==="close-view-bg"){ if(e.target===b){ state.viewing=null; render(); } }
        else if(act==="edit-view"){
          var c=cardById(state.viewing);
          if(c){ state.editing=JSON.parse(JSON.stringify(c)); state.viewing=null; render(); }
        }
        else if(act==="del-view"){
          var c=cardById(state.viewing);
          var label = c ? ((c.name||c.code||"この銘柄")) : "この銘柄";
          if(!window.confirm("「"+label+"」を削除します。よろしいですか？")) return;
          var id=state.viewing;
          state.cards=state.cards.filter(function(x){return x.id!==id;});
          state.viewing=null; save(); render();
        }
      };
    });
    // stop backdrop close when clicking inside sheet
    var sheet = app.querySelector('[data-stop]');
    if(sheet) sheet.onclick=function(e){ e.stopPropagation(); };
    // row tap → detail
    app.querySelectorAll("[data-view]").forEach(function(b){
      b.onclick=function(){ state.viewing=b.getAttribute("data-view"); render(); };
    });
    // live-bind editing fields
    app.querySelectorAll("[data-field]").forEach(function(inp){
      inp.oninput=function(){
        if(!state.editing) return;
        state.editing[inp.getAttribute("data-field")] = inp.value;
        updatePreview();
      };
    });
  }

  // update just the preview box without full re-render (keeps input focus)
  function updatePreview(){
    var v=state.editing; if(!v) return;
    var r=targetRange(v), d=divergence(v);
    var box=app.querySelector(".preview"); if(!box) return;
    box.innerHTML =
      '<div class="preview-line"><span class="preview-label">想定株価レンジ</span>'+
      '<span class="preview-value">'+(r?(yen(r.low)+"〜"+yen(r.high)):"EPS・PERを入れると自動計算")+'</span></div>'+
      (d!==null ?
        '<div class="preview-line"><span class="preview-label">下限乖離</span>'+
        '<span class="preview-value '+(d<0?"under":"over")+'">'+pct(d)+'</span></div>' : "");
  }

  function saveEditing(){
    var v=state.editing;
    if(!v.name && !v.name.trim && !v.code){}
    if(!(v.name||"").trim() && !(v.code||"").trim()){
      flash("err","銘柄名かコードのどちらかは入れてください。");
      return;
    }
    v.updatedAt = new Date().toISOString(); // 保存のたびに更新時刻を刻む
    var exists = state.cards.some(function(c){return c.id===v.id;});
    if(exists){
      state.cards = state.cards.map(function(c){ return c.id===v.id ? v : c; });
    }else{
      state.cards = state.cards.concat([v]);
    }
    save();
    state.editing=null;
    render();
  }

  // ---------- JSON export / import ----------
  function doExport(){
    var payload = { app:"kabu-memo", version:1, exportedAt:new Date().toISOString(), cards:state.cards };
    var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    a.href=url; a.download="kabu-memo-"+stamp+".json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    flash("ok","JSONを書き出しました。");
  }

  document.getElementById("importInput").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : (data && data.cards);
        if(!Array.isArray(incoming)) throw new Error("形式が違います");

        // 時刻ベースのマージ: 同じ銘柄は「最終更新が新しい方」を残す。
        var byKey = {};
        state.cards.forEach(function(c){ byKey[keyOf(c)] = c; });

        var added=0, updated=0, kept=0;
        incoming.forEach(function(raw){
          if(!raw.id) raw.id = uid();
          var inc = normalize(raw);
          var key = keyOf(inc);
          var cur = byKey[key];
          if(!cur){
            byKey[key] = inc; added++;              // こっちに無い銘柄 → 追加
          }else if(newer(inc) > newer(cur)){
            // 取り込む側の方が新しい → 更新（idは手元のものを維持して重複を防ぐ）
            inc.id = cur.id;
            byKey[key] = inc; updated++;
          }else{
            kept++;                                  // 手元の方が新しい/同じ → そのまま残す
          }
        });
        state.cards = Object.keys(byKey).map(function(k){ return byKey[k]; });
        save();

        var parts=[];
        if(added) parts.push("追加 "+added);
        if(updated) parts.push("更新 "+updated);
        if(kept) parts.push("据え置き "+kept);
        flash("ok", "読み込み完了（"+(parts.join(" / ")||"変更なし")+"）");
      }catch(err){
        flash("err","読み込めませんでした。JSONファイルをご確認ください。");
      }
      e.target.value="";
      render();
    };
    reader.readAsText(file);
  });

  // 比較用のタイムスタンプ（無ければ 0 = 最古扱い）
  function newer(c){
    var t = c && c.updatedAt ? Date.parse(c.updatedAt) : NaN;
    return isFinite(t) ? t : 0;
  }

  function keyOf(c){
    var k=(c.code||"").trim();
    return k ? ("code:"+k) : ("id:"+(c.id||uid()));
  }
  function normalize(c){
    var out = blank();
    out.id = c.id || out.id;
    CORE_KEYS.concat(EXT_KEYS).forEach(function(k){ if(c[k]!=null) out[k]=c[k]; });
    // bull/bear は配列でも文字列でも受ける（配列なら改行区切りに）
    ["bull","bear"].forEach(function(k){
      if(Array.isArray(c[k])) out[k]=c[k].join("\n");
    });
    // 旧単一eps/perフィールドがあれば下限に寄せて拾う
    if(c.eps!=null && out.epsLow==="") out.epsLow=c.eps;
    if(c.per!=null && out.perLow==="") out.perLow=c.per;
    return out;
  }

  render();
})();
</script>
</body>
